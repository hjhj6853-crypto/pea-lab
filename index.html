const COL = {"0":"#e6c53f","1":"#7a5a86"}, COL2 = {"00":"#e6c53f","01":"#8fb04a","10":"#c99a2e","11":"#3e6b3a"};
const esc = t => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const phKey = (g, n) => Array.from({length:n}, (_, i) => phIdx(g, i)).join("");

const gamete = (g, n) => Array.from({length:n}, (_, i) => g.substr(2*i, 2)[Math.random() < .5 ? 0 : 1]);
function child(a, b, n) {

const YEL = ["#e6c53f", "#c9a22a"], GRN = ["#7fb84a", "#5a9436"]; // [매끈, 주름]
const WRP = (() => { const p = []; for (let i = 0; i < 16; i++) { const a = i / 16 * 6.283, r = i % 2 ? 8.4 : 11.2; p.push((13 + r * Math.cos(a)).toFixed(1) + "," + (13 + r * .92 * Math.sin(a)).toFixed(1)); } return "M" + p.join("L") + "Z"; })();
const keysOf = n => Array.from({length: 2 ** n}, (_, i) => i.toString(2).padStart(n, "0"));
const nameK = (k, n) => [...k].map((d, i) => TR[i].ph[d]).join("·");
const STAR = (() => { const p = []; for (let i = 0; i < 10; i++) { const a = (-90 + i * 36) * Math.PI / 180, r = i % 2 ? 6.2 : 13; p.push((13 + r * Math.cos(a)).toFixed(1) + "," + (13 + r * Math.sin(a)).toFixed(1)); } return "M" + p.join("L") + "Z"; })();
function seed(k, n, s = 26) {
  const si = S.tr.indexOf(0), ci = S.tr.indexOf(1), fi = S.tr.indexOf(2), w = si >= 0 && k[si] === "1", c = (ci >= 0 && k[ci] === "1" ? GRN : YEL)[w ? 1 : 0];
  let body = w ? `<path d="${WRP}" fill="${c}" stroke="#0003"/><path d="M8 9Q13 12 18 9M8 17Q13 14 18 17M13 7V19" stroke="#0005" fill="none"/>`
               : `<circle cx="13" cy="13" r="11" fill="${c}" stroke="#0002"/><ellipse cx="9.5" cy="9" rx="3" ry="2" fill="#fff6"/>`;
  if (fi >= 0) { const wh = k[fi] === "1";
    body = `<path d="${STAR}" fill="${wh ? "#fff" : "#8e5bd0"}" stroke="${wh ? "#8b95a0" : "#5b2f9e"}"/><g transform="translate(13 13) scale(.68) translate(-13 -13)">${body}</g>`; }
  return `<svg width="${s}" height="${s}" viewBox="0 0 26 26"><title>${nameK(k, n)}</title>${body}</svg>`;
}
const KEYS = ["plants", "sel", "cum", "kids", "last", "no", "ctr", "pairs"];
const TRS = {1:[0], 2:[1], 3:[0, 1], 4:[0, 1, 2]};
const total = pk => Object.values(S.cum[pk] || {}).reduce((s, x) => s + x, 0);
const snap = () => Object.fromEntries(KEYS.map(k => [k, S[k]]));
const AK = () => "mendel:" + S.code + "|" + S.name;
function persist() {
  if (!S.name || !S.stage) return;
  S.saved = S.saved || {}; S.saved[S.stage] = snap();
  try { localStorage.setItem(AK(), JSON.stringify({pin:S.pin, prog:S.prog, saved:S.saved, stage:S.stage})); } catch (e) {}
}
function syncProg() { send("progress", {pin:S.pin, sub:S.prog.sub, ver:S.prog.ver, quiz:S.prog.quiz, unlock:S.prog.unlock, pred:S.prog.pred, fin:!!S.prog.finSeen}); }

                {id:"P2", gen:0, label:"부모 " + TR.map(t => t.ph[1]).join("·") + " 완두", g:TR.map(t => t.L.toLowerCase() + t.L.toLowerCase()).join("")}];
  }

  {id:"e1", n:1, t:"실험 1", s:"씨 모양", open:() => true, done:() => doneE(1)},

  const st = STEPS.find(x => x.id === id); if (!st.open()) return toast(st.why);

  else if (id === "fin") { const first = !S.prog.finSeen; S.prog.finSeen = true; S.view = "fin"; syncProg(); render(); if (first) { try { confetti(); } catch (e) {} } }
  else { S.view = id; render(); }

    const all = sub.reduce((s, st) => s + Q.qs.filter((q, i) => q.ok(st.ans[i])).length, 0);
    const sum = T ? `<tr class="sumrow"><th>정답률</th>${Q.qs.map((q, i) => `<td><b>${pct(hit(i), T)}</b> (${hit(i)}/${T}명)</td>`).join("")}<td><b>${pct(all, T * N)}</b></td></tr>` : "";
    const rows = names.map(nm => { const st = (P[nm].quiz || {})[id];
      if (!st || !st.done) return `<tr><th>${esc(nm)}</th>${Q.qs.map(() => "<td>·</td>").join("")}<td>·</td></tr>`;
      const r = Q.qs.map((q, i) => q.ok(st.ans[i])), c = r.filter(Boolean).length;
      return `<tr><th>${esc(nm)}</th>${Q.qs.map((q, i) => `<td class="${r[i] ? "cok" : "cno"}">${r[i] ? "✓ " : "✗ "}${esc(st.ans[i].join(", "))}</td>`).join("")}<td class="${c === N ? "cok" : "cno"}"><b>${c}/${N}</b></td></tr>`; }).join("");
    return `<div class="sub-h">${Q.t}</div><div class="pw"><table><tr><th>학생</th>${Q.qs.map((q, i) => `<th>문항 ${i + 1}</th>`).join("")}<th>점수</th></tr>${sum}${rows}</table></div>`;
  }).join("");
}
window.tsel = nm => { TSEL = nm; tdraw(); const e = document.getElementById("stu"); if (e) e.scrollIntoView({behavior:"smooth"}); };
async function admSend(action, step) {

function stuSec() {

  <div class="sub-h">예상해 보기 기록</div><p>${Object.keys(pred).length ? Object.keys(pred).sort().map(s => `실험 ${s}: ${pred[s]}%`).join(" · ") : "아직 없어요."}</p>
  <div class="sub-h">최근 교배 기록 (최대 40건)</div>${rows ? `<div class="pw"><table><tr><th>실험</th><th>부모</th><th>씨앗</th><th>결과</th></tr>${rows}</table></div>` : '<p class="muted">교배 기록이 없어요.</p>'}</div></section>`;
}
const csvq = v => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
function csvText() {
  const names = [...new Set(TROWS.filter(r => r.kind !== "admin").map(r => r.student))].sort();
  const H = ["학생"]; [1, 2, 3, 4].forEach(s => H.push(`실험${s} 교배횟수`, `실험${s} 씨앗수`, `실험${s} 메모제출`, `실험${s} 검증`, `실험${s} 예상(%)`));
  ["A", "B"].forEach(id => { H.push(`형성평가${id} 점수`, `형성평가${id} 처음점수`); QZ[id].qs.forEach((q, i) => H.push(`형성평가${id} 문항${i + 1} 답`, `형성평가${id} 문항${i + 1} 정오`)); });
  [1, 2, 3, 4].forEach(s => GD[s].forEach((q, i) => H.push(`실험${s} 질문${i + 1} 답안`)));
  const rows = names.map(nm => {
    const pg = lastBy("progress", nm) || {}, cr = TROWS.filter(r => r.kind === "cross" && r.student === nm), row = [nm];
    [1, 2, 3, 4].forEach(s => { const c = cr.filter(r => r.payload.stage === s); row.push(c.length, c.reduce((a, r) => a + r.payload.n, 0), (pg.sub || {})[s] ? "O" : "", (pg.ver || {})[s] ? "O" : "", (pg.pred || {})[s] != null ? pg.pred[s] : ""); });
    ["A", "B"].forEach(id => { const st = (pg.quiz || {})[id], N = QZ[id].qs.length; row.push(st && st.done ? QZ[id].qs.filter((q, i) => q.ok(st.ans[i])).length + "/" + N : "", st && st.done ? (st.first != null ? st.first : "") + "/" + N : ""); QZ[id].qs.forEach((q, i) => row.push(st && st.done ? st.ans[i].join(", ") : "", st && st.done ? (q.ok(st.ans[i]) ? "O" : "X") : "")); });
    [1, 2, 3, 4].forEach(s => { const n = TROWS.filter(r => r.kind === "note" && r.student === nm && r.payload.stage === s), p = n.length ? n[n.length - 1].payload : null; GD[s].forEach((q, i) => row.push(p ? (p.answers ? p.answers[i] : (i === 0 ? p.text : "")) : "")); });
    return row; });
  return "\ufeff" + [H, ...rows].map(r => r.map(csvq).join(",")).join("\r\n");
}
window.csv = () => {
  const b = new Blob([csvText()], {type:"text/csv;charset=utf-8"}), a = document.createElement("a");
  a.href = URL.createObjectURL(b); a.download = `완두콩실험_${TCODE}.csv`; document.body.appendChild(a); a.click(); a.remove();
};
window.big = () => { document.documentElement.classList.toggle("big"); };

  <section class="sec s1"><div class="sec-h">반 전체 교배 결과<small>모든 학생의 결과를 합쳐서 보여줘요 (실험 ${s})</small></div><div class="sec-b">${["PP", "F1", "OT"].map(t => A[t] ? aggCard(s, t, A[t]) : `<div class="sub-h">${TY[t]}</div><p class="muted">아직 기록이 없어요.</p>`).join("")}</div></section>
  <section class="sec s2"><div class="sec-h">내가 발견한 규칙 제출<small>실험 ${s}의 질문별로 학생들의 답안을 한꺼번에 봐요</small></div><div class="sec-b">${notesSec(s)}</div></section>

window.watch = async () => {
