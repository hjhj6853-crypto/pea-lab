const YEL = ["#e6c53f", "#c9a22a"], GRN = ["#7fb84a", "#5a9436"]; // [매끈, 주름]

function seed(k, n, s = 26) {
  const si = S.tr.indexOf(0), ci = S.tr.indexOf(1), fi = S.tr.indexOf(2), w = si >= 0 && k[si] === "1", c = (ci >= 0 && k[ci] === "1" ? GRN : YEL)[w ? 1 : 0];

  if (fi >= 0) { const wh = k[fi] === "1";
    body = `<path d="${STAR}" fill="${wh ? "#fff" : "#8e5bd0"}" stroke="${wh ? "#8b95a0" : "#5b2f9e"}"/><g transform="translate(13 13) scale(.68) translate(-13 -13)">${body}</g>`; }

}
const KEYS = ["plants", "sel", "cum", "kids", "last", "no", "ctr", "pairs"];
const TRS = {1:[0], 2:[1], 3:[0, 1], 4:[0, 1, 2]};
const total = pk => Object.values(S.cum[pk] || {}).reduce((s, x) => s + x, 0);
const snap = () => Object.fromEntries(KEYS.map(k => [k, S[k]]));
const AK = () => "mendel:" + S.code + "|" + S.name;
function persist() {
  if (!S.name || !S.stage) return;
  S.saved = S.saved || {}; S.saved[S.stage] = snap();
  try { localStorage.setItem(AK(), JSON.stringify({pin:S.pin, prog:S.prog, saved:S.saved, stage:S.stage})); } catch (e) {}
}
function syncProg() { send("progress", {pin:S.pin, sub:S.prog.sub, ver:S.prog.ver, quiz:S.prog.quiz}); }
function startStage(n) {
  if (S.stage) { S.saved = S.saved || {}; S.saved[S.stage] = snap(); }
  S.stage = n; S.view = "e" + n; S.tr = TRS[n]; TR = S.tr.map(i => TRALL[i]); S.n = TR.length; S.vp = null; S.cf = false;
  const sv = S.saved && S.saved[n];
  if (sv) Object.assign(S, sv);

    S.sel = {P:[], F:[]}; S.cum = {}; S.kids = {}; S.last = null; S.no = {}; S.ctr = 0; S.pairs = {};
    S.plants = [{id:"P1", gen:0, label:"부모 " + TR.map(t => t.ph[0]).join("·") + " 완두", g:TR.map(t => t.L + t.L).join("")},
                {id:"P2", gen:0, label:"부모 " + TR.map(t => t.ph[1]).join("·") + " 완두", g:TR.map(t => t.L.toLowerCase() + t.L.toLowerCase()).join("")}];
  }

}
const doneE = n => !!(S.prog.sub[n] && S.prog.ver[n]), doneQ = id => !!(S.prog.quiz[id] && S.prog.quiz[id].done);
const STEPS = [
  {id:"e1", n:1, t:"실험 1", s:"씨 모양", open:() => true, done:() => doneE(1)},
  {id:"e2", n:2, t:"실험 2", s:"씨 색깔", open:() => true, done:() => doneE(2)},
  {id:"qA", t:"형성평가 ①", s:"분리의 법칙", open:() => doneE(1) || doneE(2), why:"실험 1 또는 실험 2의 메모 제출과 검증을 마치면 열려요.", done:() => doneQ("A")},
  {id:"e3", n:3, t:"실험 3", s:"씨 모양 + 씨 색깔", open:() => doneQ("A") && doneE(1) && doneE(2), why:"실험 1, 2를 모두 마치고 형성평가 ①까지 마치면 열려요.", done:() => doneE(3)},
  {id:"qB", t:"형성평가 ②", s:"독립의 법칙", open:() => doneE(3), why:"실험 3의 메모 제출과 검증을 마치면 열려요.", done:() => doneQ("B")},
  {id:"e4", n:4, t:"실험 4", s:"모양 + 색깔 + 꽃 색", open:() => doneQ("B"), why:"형성평가 ②를 마치면 열려요.", done:() => doneE(4)}];
window.go = id => { const st = STEPS.find(x => x.id === id); if (!st.open()) return toast(st.why); if (st.n) startStage(st.n); else { S.view = id; render(); } };
const norm = a => (a || "").replace(/\s/g, "");
const QZ = {
  A:{t:"형성평가 ① 분리의 법칙", qs:[
    {t:"생식세포를 만들 때 한 쌍의 대립유전자가 분리되어 다음 세대로 유전되는 현상을 {}(이)라고 한다.", ans:"분리의 법칙", ok:a => norm(a[0]).replace(/의/g, "") === "분리법칙"},
    {t:"유전자형이 Rr인 개체가 만들 수 있는 생식세포의 종류는 {}, {}가 있다.", ans:"R, r (순서는 상관없어요)", ok:a => [norm(a[0]), norm(a[1])].sort().join() === "R,r"}]},
  B:{t:"형성평가 ② 독립의 법칙", qs:[
    {t:"유전자형이 RrYy인 완두가 만드는 생식세포의 종류는 {}가지이다.", ans:"4", ok:a => norm(a[0]).replace(/가지/g, "") === "4"},
    {t:"완두의 교배에서 둥글고 황색, 둥글고 녹색, 주름지고 황색, 주름지고 녹색인 완두의 비가 9:3:3:1일 때, 둥근 완두와 주름진 완두의 비는 {}가 된다.", ans:"3:1", ok:a => norm(a[0]).replace(/대/g, ":") === "3:1"}]}};
function quizView(id) {
  const Q = QZ[id], st = S.prog.quiz[id] = S.prog.quiz[id] || {ans:Q.qs.map(q => q.t.split("{}").slice(1).map(() => "")), done:false}, d = st.done;
  const body = Q.qs.map((q, i) => { const parts = q.t.split("{}"), ok = d && q.ok(st.ans[i]);
    return `<div class="q ${d ? (ok ? "ok" : "no") : ""}"><b>${i + 1}.</b> ${parts.map((p, j) => esc(p) + (j < parts.length - 1 ? `<input class="bl" ${d ? "readonly" : ""} value="${esc(st.ans[i][j])}" oninput="qa('${id}',${i},${j},this.value)">` : "")).join("")}${d ? `<div class="muted">${ok ? "✓ 정답이에요!" : "✗ 정답: <b>" + esc(q.ans) + "</b>"}</div>` : ""}</div>`; }).join("");
  const nb = nextBtns();
  return `<section class="sec s3"><div class="sec-h">${Q.t}<small>빈칸을 모두 채우고 제출하세요</small></div><div class="sec-b">${body}${d ? `<div class="hint">제출을 마쳤어요. ${nb ? "다음으로 할 수 있는 단계를 골라 보세요." : "모든 단계를 마쳤어요!"}</div>${nb}` : `<p><button onclick="submitQuiz('${id}')">제출하기</button></p>`}</div></section>`;
}
window.qa = (id, i, j, v) => { S.prog.quiz[id].ans[i][j] = v; };
window.submitQuiz = id => {
  const st = S.prog.quiz[id]; if (st.ans.some(r => r.some(x => !x.trim()))) return toast("빈칸을 모두 채워 주세요.");

};
async function send(kind, payload) {
  if (!sb) return;
  const {error} = await sb.from("logs").insert({class_code:S.code, student:S.name, kind, payload});
  if (error) toast("서버 저장에 실패했어요. 선생님께 알려주세요.");

const byId = id => S.plants.find(p => p.id === id);

  const s = S.sel[z], n = S.n; if (!s.length) return;
  const a = byId(s[0]), b = byId(s[1] || s[0]), pk = [a.id, b.id].sort().join("+"), c = {};

  S.pairs[pk] = {a, b}; S.last = {z, pk, a, b};

    const gen = Math.max(L.a.gen, L.b.gen) + 1;

  try { acc = JSON.parse(localStorage.getItem(AK()) || "null"); localStorage.setItem("mendel-last", JSON.stringify({code, name})); } catch (e) {}
  if (!acc && sb) {
    const {data} = await sb.from("logs").select("payload").eq("class_code", code).eq("student", name).eq("kind", "progress").order("created_at", {ascending:false}).limit(1);
    if (data && data[0]) { const p = data[0].payload; acc = {pin:p.pin, prog:{sub:p.sub || {}, ver:p.ver || {}, quiz:p.quiz || {}, notes:{}}, saved:{}, stage:1}; }
  }
  if (acc && acc.pin !== ph) return toast("비밀번호가 맞지 않아요.");
  S.pin = ph; S.prog = acc ? acc.prog : {sub:{}, ver:{}, quiz:{}, notes:{}}; S.prog.notes = S.prog.notes || {};
  S.sub = S.prog.sub; S.notes = S.prog.notes; S.saved = acc ? acc.saved : {};
  startStage(acc && acc.stage ? acc.stage : 1);
};
window.logout = () => { persist(); login(); };

// ---- 교사용 (주소 뒤에 ?teacher 를 붙여 접속) ----
function teacher() {
  app.innerHTML = `<h1>교사용 화면</h1><div class="card row"><label>비밀번호<input id="pin" type="password"></label><button onclick="tpin()">들어가기</button></div>`;
}
window.tpin = () => {
  if ($("#pin").value !== TEACHER_PIN) return toast("비밀번호가 맞지 않아요.");
  app.innerHTML = `<h1>교사용 화면</h1><div class="card row"><label>반 코드<input id="tc" placeholder="예: 3-2"></label><button onclick="watch()">불러오기</button></div><div id="board"></div>`;
};
let chan = null;
window.watch = async () => {
  if (!sb) return toast("서버 설정이 필요해요.");
  const code = $("#tc").value.trim(); if (chan) sb.removeChannel(chan);
  let rows = [];
  const draw = () => {
    const by = {}; rows.forEach(r => (by[r.student] = by[r.student] || []).push(r));
    $("#board").innerHTML = Object.keys(by).sort().map(s => {
      const R = by[s], cr = {1:0, 2:0, 3:0, 4:0}; R.filter(r => r.kind === "cross").forEach(r => { cr[r.payload.stage]++; });
      const pgs = R.filter(r => r.kind === "progress"), pg = pgs.length ? pgs[pgs.length - 1].payload : {}, sub = pg.sub || {}, ver = pg.ver || {}, qz = pg.quiz || {}, nt = R.filter(r => r.kind === "note");
      const q = id => qz[id] && qz[id].done ? `제출 (${qz[id].score}/2) · 답: ${esc(qz[id].ans.map(a => a.join(", ")).join(" / "))}` : "·";
      return `<div class="card"><h2>${esc(s)}</h2><table><tr><th>단계</th><th>교배</th><th>메모 제출</th><th>검증</th></tr>${[1, 2, 3, 4].map(n => `<tr><th>실험 ${n}</th><td>${cr[n]}회</td><td>${sub[n] ? "✓" : "·"}</td><td>${ver[n] ? "✓" : "·"}</td></tr>`).join("")}<tr><th>형성평가 ①</th><td colspan="3">${q("A")}</td></tr><tr><th>형성평가 ②</th><td colspan="3">${q("B")}</td></tr></table>${nt.map(r => `<p><b>실험${r.payload.stage} 메모:</b> ${esc(r.payload.text)}</p>`).join("")}</div>`;
    }).join("") || '<p class="muted">아직 기록이 없어요.</p>';
  };
  const {data} = await sb.from("logs").select("*").eq("class_code", code).order("created_at"); rows = data || []; draw();
  chan = sb.channel("logs-" + code).on("postgres_changes", {event:"INSERT", schema:"public", table:"logs", filter:"class_code=eq." + code}, p => { rows.push(p.new); draw(); }).subscribe();
};
location.search.includes("teacher") ? teacher() : login();
</script></body></html>
